## SotM FR 2025

Frédéric Rodrigo - Teritorio

f.rodrigo@teritorio.fr

<!--

Aperçu technique du cheminement de la donnée et des logiciels libres développés et mis en œuvre par Teritorio pour présenter des données maîtrisées et uniformisées sur une carte web.

CartoGuide est un écosystème de logiciels permettant l'utilisation de données OSM, métier et tierces sur une carte web grand public.

Tout commence par l'ontologie, qui définit une arborescence thématique de POI avec les définitions des tags OSM d'identification des objets, les traductions, les tags complémentaires... et des représentations d'icônes et de couleur.

Ces POI sont extraits d'OSM par le projet Datasources via le proxy qualité de données OSM Clearance. Datasources permet également de convertir d'autres sources de données au format OSM et de garantir que les attributs sont correctement structurés et donc interprétables et avec leurs traductions. Toutes les données sont converties dans un format dérivé des tags OSM, structuré sur plusieurs niveaux et parfois enrichi... et intégralement documenté.

Ces données sont ensuite mises à disposition par une API (Elasa) et affichées sur une carte Web (Vido).

-->

Hiérarchie de POI sur 3 niveaux

- JSON

- Ontologie Tourisme
- Ontologie Ville

## Ontologie - Exemple

`amenity` > `sanitary` > `toilets`
- Sélection : `[amenity=toilets][access!~"no|private"]`
- Traduction : `EN: toilets, FR: toilettes`
- Groupe d'attributs : `base`, `fee`, `access`, `toilets`, `disabled`
- Affichage : icône et couleur <img alt="Icône et couleur de l'ontologie" src="include/01-onto.png" style="margin: 0px;"/>

### Elasa-Datasources
## Un ETL pour OSM

- Validation : [JSON Schema](https://github.com/teritorio/elasa-datasources/tree/master/datasources/schemas/tags)
- i18n : tout est traduit pour les humains

-> Assure que toutes les données en sortie sont documentées, valides (schéma) et traduites

-> Produit de simples fichiers : GeoJSON, JSON Schema, traductions

----

### Elasa-Datasources
## Configuration OSM

```yaml
streetart-bayonne:
  connector:
    type: OverpassSelect
    metadata:
      name:
        fr-FR: Streetart
    overpass: https://clearance.teritorio.xyz/api/0.1/projects/france_pyrenees_atlantiques_poi/overpasslike
    relation_ids: [166713]
    select:
    - "[tourism=artwork][operator=\"Communauté d'agglomération Pays Basque\"]"
```

## Elasa
### Back office de la carto web

- Base de données Postgres
  - Contient les GeoJSON de Elasa-Datasources
- Paramètres de la carte web
  - Menu, icônes, couleur, titre, logo...
- API
- Interface d'administration : Directus (CMS Headless)

----

### Elasa
## Données métiers

Tables de données qui ne peuvent pas aller dans OSM
Administrées directement dans Elasa
- Données métiers
- Itinéraire non OSM
- Données éditorialisées
  - Description commerciale, photo...
- Événementiel, travaux

## Vido
### Carte Web

- MapLibre + Plugin Teritorio Cluster
- Menu + Filtres
- Recherche
- Carnet de POI favoris
- Parcours et polygones
- Fiche de détail, points de passage et points d'intérêt liés
